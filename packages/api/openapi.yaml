  /check-ins:
    get:
      tags: [Check-ins]
      summary: List check-ins
      operationId: listCheckIns
      description: Returns last 30 days if no date range is provided.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/XTimezone"
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Start date (inclusive)
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: End date (inclusive)
        - name: habitId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by habit
      responses:
        "200":
          description: List of check-ins
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CheckIn"
        "400":
          description: Invalid date range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags: [Check-ins]
      summary: Create a check-in
      operationId: createCheckIn
      description: Idempotent — returns 200 if check-in already exists for habitId + date.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/XTimezone"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckInBody"
      responses:
        "200":
          description: Check-in already existed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CheckIn"
        "201":
          description: Check-in created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CheckIn"
        "400":
          description: Future date not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Habit not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /check-ins/today:
    get:
      tags: [Check-ins]
      summary: Get today's check-ins
      operationId: getTodayCheckIns
      description: >-
        "Today" is computed per-habit using that habit's own timezone
        (falling back to the X-Timezone header, then UTC).
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/XTimezone"
      responses:
        "200":
          description: Today's check-ins
          content:

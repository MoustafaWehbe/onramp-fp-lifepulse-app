          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /check-ins/{id}:
    delete:
      tags: [Check-ins]
      summary: Un-complete a check-in
      operationId: deleteCheckIn
      description: >-
        Soft toggle, not a hard delete — marks the check-in as not completed
        while keeping the row (and its original createdAt) for history.
        Re-completing the same habit + date later flips it back on rather
        than creating a duplicate.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Un-completed
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Check-in not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /coach-requests/{id}/habits/{habitId}:
    patch:
      tags: [Coaching]
      summary: Adjust a client's habit (coach only, with permission)
      operationId: updateClientHabit
      description: >-
        Requires the client's `editHabits` grant; 403 without it, and the
        grant can be withdrawn at any moment. Every change that alters
        something is written into the feedback thread as a `habit_change`
        entry, so the client is never surprised by an edited plan.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The coaching request id
          schema:
            type: string
            format: uuid
        - name: habitId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachUpdateHabitBody"
      responses:
        "200":
          description: The updated habit
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Habit"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not this request's coach, not accepted, or no edit permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Request or habit not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

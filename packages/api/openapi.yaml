openapi: 3.1.0

info:
  title: KULTIVAR API
  version: 1.0.0
  description: |
    REST API for the KULTIVAR habit tracker.

    **Auth:** HttpOnly cookies (`accessToken`, `refreshToken`). Use `credentials: "include"` on all requests.

    **Status:** Auth, Profile, Goals, Life Areas, Habits, and Check-ins are implemented.

servers:
  - url: /api
    description: Default server

tags:
  - name: Auth
    description: Authentication and session management
  - name: Profile
    description: User profile and onboarding
  - name: Goals
    description: Goal catalog used during onboarding and profile editing
  - name: Life Areas
    description: Life area categories that group habits
  - name: Habits
    description: Habits within life areas
  - name: Check-ins
    description: Daily habit completion records
  - name: Coaching
    description: >-
      The coach directory, coaching requests, and the data a user chooses to
      share with a coach they invited.

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
      description: HttpOnly access token cookie set on login

  parameters:
    XTimezone:
      name: X-Timezone
      in: header
      required: false
      schema:
        type: string
        example: "America/New_York"
      description: >-
        Caller's IANA timezone (e.g. from Intl.DateTimeFormat().resolvedOptions().timeZone
        in a browser). Used as a fallback "today" boundary for habits that
        don't have their own timezone set; a habit's own timezone always
        wins. Falls back to UTC if omitted entirely.

  schemas:
    RegisterBody:
      type: object
      required: [email, password, name]
      description: >-
        The `role` picks which product the account gets. A coach is asked for
        their directory details here, on the same form — `coachingTitle` is
        required when `role` is `coach`, and the other coach fields are
        optional. All coach fields are ignored when `role` is `user`.
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 8
          description: Must contain at least one uppercase letter and one number
          example: Password1
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Jane Doe
        role:
          type: string
          enum: [user, coach]
          default: user
        coachingTitle:
          type: string
          minLength: 2
          maxLength: 255
          example: Certified Life & Habit Coach
        bio:
          type: string
          maxLength: 4000
        specialties:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 100
          example: [Burnout recovery, Morning routines]
        yearsExperience:
          type: integer
          minimum: 0
          maximum: 80

    LoginBody:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 1
          example: Password1

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [user, coach]
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Profile:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
          readOnly: true
        ageRange:
          type: string
          enum: ["18-24", "25-34", "35-44", "45-54", "55+"]
          nullable: true
        profession:
          type: string
          maxLength: 255
          nullable: true
        industry:
          type: string
          maxLength: 255
          nullable: true
        educationLevel:
          type: string
          enum: [high_school, associate, bachelor, master, doctorate, other]
          nullable: true
        livingSituation:
          type: string
          enum: [apartment, house, dormitory, other]
          nullable: true
        lifestyleTypes:
          type: array
          items:
            type: string
        stressSources:
          type: array
          items:
            type: string
        dailyFreeTime:
          type: integer
          nullable: true
        energyPattern:
          type: string
          enum: [morning, afternoon, evening]
          nullable: true
        stressBaseline:
          type: string
          enum: [low, medium, high]
          nullable: true
        workloadIntensity:
          type: string
          enum: [low, medium, high]
          nullable: true
        motivationDriver:
          type: string
          enum: [achievement, health, family, financial_freedom, other]
          nullable: true
        failureResponse:
          type: string
          nullable: true
        topValues:
          type: array
          items:
            type: string
        identityStatements:
          type: array
          items:
            type: string
        badHabits:
          type: array
          items:
            type: string
        goals:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 200
        stressLevel:
          type: integer
          minimum: 1
          maximum: 10
          nullable: true
        sleepHours:
          type: number
          minimum: 0
          maximum: 24
          nullable: true
        onboarded:
          type: boolean

    Goal:
          type: object
          properties:
            slug:
              type: string
              example: "focus-clarity"
            label:
              type: string
              example: "Focus & Clarity"

    UpdateProfileBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        ageRange:
          type: string
          enum: ["18-24", "25-34", "35-44", "45-54", "55+"]
        profession:
          type: string
          maxLength: 255
        industry:
          type: string
          maxLength: 255
        educationLevel:
          type: string
          enum: [high_school, associate, bachelor, master, doctorate, other]
        livingSituation:
          type: string
          enum: [apartment, house, dormitory, other]
        lifestyleTypes:
          type: array
          items:
            type: string
        stressSources:
          type: array
          items:
            type: string
        dailyFreeTime:
          type: integer
        energyPattern:
          type: string
          enum: [morning, afternoon, evening]
        stressBaseline:
          type: string
          enum: [low, medium, high]
        workloadIntensity:
          type: string
          enum: [low, medium, high]
        motivationDriver:
          type: string
          enum: [achievement, health, family, financial_freedom, other]
        failureResponse:
          type: string
        topValues:
          type: array
          items:
            type: string
        identityStatements:
          type: array
          items:
            type: string
        badHabits:
          type: array
          items:
            type: string
        goals:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 200
        stressLevel:
          type: integer
          minimum: 1
          maximum: 10
        sleepHours:
          type: number
          minimum: 0
          maximum: 24

    OnboardingBody:
      allOf:
        - $ref: "#/components/schemas/UpdateProfileBody"
        - type: object
          required: [goals]

    AreaColor:
      type: string
      enum:
        [
          health,
          career,
          spirit,
          social,
          learning,
          creative,
          finance,
          family,
          adventure,
          rest,
        ]

    LifeArea:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 50
        color:
          $ref: "#/components/schemas/AreaColor"
        description:
          type: string
          maxLength: 300
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    HabitSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        frequency:
          $ref: "#/components/schemas/Frequency"
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    LifeAreaWithHabits:
      allOf:
        - $ref: "#/components/schemas/LifeArea"
        - type: object
          properties:
            habits:
              type: array
              items:
                $ref: "#/components/schemas/HabitSummary"

    CreateLifeAreaBody:
      type: object
      required: [name, color]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        color:
          $ref: "#/components/schemas/AreaColor"
        description:
          type: string
          maxLength: 300

    UpdateLifeAreaBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        color:
          $ref: "#/components/schemas/AreaColor"
        description:
          type: string
          maxLength: 300
          nullable: true

    Frequency:
      type: string
      enum: [daily, weekdays, 3x, 5x, weekly]

    Difficulty:
      type: string
      enum: [easy, medium, hard]

    Habit:
      type: object
      properties:
        id:
          type: string
          format: uuid
        areaId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        frequency:
          $ref: "#/components/schemas/Frequency"
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 1440
          nullable: true
        difficulty:
          allOf:
            - $ref: "#/components/schemas/Difficulty"
          nullable: true
        notes:
          type: string
          maxLength: 500
          nullable: true
        reminderEnabled:
          type: boolean
          description: Whether a reminder is scheduled for this habit.
        reminderTime:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          example: "07:30"
          nullable: true
          description: 24-hour local time the reminder fires at. Required when reminderEnabled is true.
        timezone:
          type: string
          example: "America/New_York"
          nullable: true
          description: IANA timezone reminderTime is expressed in. Required when reminderEnabled is true.
        daysOfWeek:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
          nullable: true
          example: [1, 3, 5]
          description: >-
            Explicit weekdays (0=Sun..6=Sat) this habit runs on. Only
            meaningful for "3x"/"5x"/"weekly" frequencies — "daily" and
            "weekdays" already imply their own days. Null means unspecified,
            in which case reminders fire every day instead.
        archivedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateHabitBody:
      type: object
      required: [areaId, name, frequency]
      properties:
        areaId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        frequency:
          $ref: "#/components/schemas/Frequency"
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 1440
        difficulty:
          $ref: "#/components/schemas/Difficulty"
        notes:
          type: string
          maxLength: 500
        reminderEnabled:
          type: boolean
          default: false
        reminderTime:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          example: "07:30"
          description: Required when reminderEnabled is true.
        timezone:
          type: string
          example: "America/New_York"
          description: Required when reminderEnabled is true.
        daysOfWeek:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
          example: [1, 3, 5]
          description: >-
            Explicit weekdays (0=Sun..6=Sat) for "3x"/"5x"/"weekly"
            frequencies. Omit to fall back to firing reminders every day.

    UpdateHabitBody:
      type: object
      properties:
        areaId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        frequency:
          $ref: "#/components/schemas/Frequency"
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 1440
          nullable: true
        difficulty:
          allOf:
            - $ref: "#/components/schemas/Difficulty"
          nullable: true
        notes:
          type: string
          maxLength: 500
          nullable: true
        reminderEnabled:
          type: boolean
        reminderTime:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          example: "07:30"
          nullable: true
        timezone:
          type: string
          example: "America/New_York"
          nullable: true
        daysOfWeek:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
          nullable: true
          example: [1, 3, 5]

    CheckIn:
      type: object
      properties:
        id:
          type: string
          format: uuid
        habitId:
          type: string
          format: uuid
        date:
          type: string
          format: date
          example: "2024-06-26"
        createdAt:
          type: string
          format: date-time

    CreateCheckInBody:
      type: object
      required: [habitId]
      properties:
        habitId:
          type: string
          format: uuid
        date:
          type: string
          format: date
          description: >-
            Optional. Defaults to "today" in the habit's own timezone
            (falling back to the X-Timezone header, then UTC). Only pass an
            explicit date when backfilling a past day — future dates are
            rejected.

    CoachCredential:
      type: object
      description: >-
        A qualification a coach lists on their own profile. Self-reported —
        nothing in the product verifies it.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: ICF Associate Certified Coach
        issuer:
          type: string
          nullable: true
          example: International Coaching Federation

    Coach:
      type: object
      description: A coach's public directory listing.
      properties:
        id:
          type: string
          format: uuid
          description: The coach's user id — this is what you send as `coachId`.
        name:
          type: string
          description: Display name if the coach set one, otherwise their account name.
        displayName:
          type: string
          nullable: true
        coachingTitle:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        specialties:
          type: array
          items:
            type: string
        yearsExperience:
          type: integer
          nullable: true
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/CoachCredential"

    MyCoachProfile:
      type: object
      description: The signed-in coach's own editable profile.
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          nullable: true
        coachingTitle:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        specialties:
          type: array
          items:
            type: string
        yearsExperience:
          type: integer
          nullable: true
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/CoachCredential"

    UpdateCoachProfileBody:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 255
        coachingTitle:
          type: string
          minLength: 1
          maxLength: 255
        bio:
          type: string
          minLength: 1
          maxLength: 4000
        specialties:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 100
        yearsExperience:
          type: integer
          minimum: 0
          maximum: 80

    CreateCredentialBody:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        issuer:
          type: string
          minLength: 1
          maxLength: 255

    CoachRequest:
      type: object
      description: >-
        A user's invitation to a coach, and the permission grant attached to
        it. The three grant flags are set by the user and can be changed or
        revoked by them at any time.
      properties:
        id:
          type: string
          format: uuid
        requesterId:
          type: string
          format: uuid
        coachId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, accepted, declined]
        shareHabits:
          type: boolean
        shareProfile:
          type: boolean
        editHabits:
          type: boolean
          description: >-
            Whether the coach may adjust this client's habits. Only ever true
            alongside `shareHabits` — the API refuses a grant to edit habits
            the coach cannot see.
        createdAt:
          type: string
          format: date-time
        coach:
          type: object
          description: Present on requests the signed-in user sent.
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        requester:
          type: object
          description: Present on requests the signed-in coach received.
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            email:
              type: string
              format: email

    CreateCoachRequestBody:
      type: object
      required: [coachId]
      properties:
        coachId:
          type: string
          format: uuid
        shareHabits:
          type: boolean
          default: false
        shareProfile:
          type: boolean
          default: false
        editHabits:
          type: boolean
          default: false
          description: Requires `shareHabits`; 422 otherwise.

    UpdateCoachRequestStatusBody:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [accepted, declined]

    UpdateSharingBody:
      type: object
      required: [shareHabits, shareProfile, editHabits]
      properties:
        shareHabits:
          type: boolean
        shareProfile:
          type: boolean
        editHabits:
          type: boolean
          description: Requires `shareHabits`; 422 otherwise.

    ClientHabit:
      type: object
      description: >-
        One of the client's habits as their coach sees it. Raw completion dates
        are returned rather than a percentage so the coach's view scores
        consistency with the same code the client's own Progress page uses.
      properties:
        id:
          type: string
          format: uuid
        areaId:
          type: string
          format: uuid
        name:
          type: string
        frequency:
          $ref: "#/components/schemas/Frequency"
        daysOfWeek:
          type: array
          nullable: true
          items:
            type: integer
            minimum: 0
            maximum: 6
        durationMinutes:
          type: integer
          nullable: true
        difficulty:
          $ref: "#/components/schemas/Difficulty"
        notes:
          type: string
          nullable: true
        completionDates:
          type: array
          description: Completed dates inside `windowDates`, ascending.
          items:
            type: string
            format: date
        currentStreak:
          type: integer
          description: Consecutive days, read over a year of history.
        lastCompletedOn:
          type: string
          format: date
          nullable: true

    ClientData:
      type: object
      description: >-
        Only the sections the user granted are present: `areas` requires
        `shareHabits`, `profile` requires `shareProfile`.
      properties:
        canEditHabits:
          type: boolean
          description: >-
            Whether this coach may PATCH the client's habits. Always present,
            so the UI can render read-only without a second call.
        windowDates:
          type: array
          description: >-
            The 30 calendar days the coach's view covers, ascending, ending
            today in the caller's timezone (see the X-Timezone header).
          items:
            type: string
            format: date
        areas:
          type: array
          description: The client's own life areas, in their own order, each with its habits.
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              color:
                $ref: "#/components/schemas/AreaColor"
              description:
                type: string
                nullable: true
              habits:
                type: array
                items:
                  $ref: "#/components/schemas/ClientHabit"
        profile:
          $ref: "#/components/schemas/Profile"

    CoachUpdateHabitBody:
      type: object
      description: >-
        The shape of the plan, and nothing else. Reminder settings and the
        habit's life area are not editable by a coach — those are the client's
        own; see the schema source for the reasoning.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        frequency:
          $ref: "#/components/schemas/Frequency"
        daysOfWeek:
          type: array
          nullable: true
          minItems: 1
          maxItems: 7
          items:
            type: integer
            minimum: 0
            maximum: 6
        durationMinutes:
          type: integer
          nullable: true
          minimum: 1
          maximum: 1440
        difficulty:
          type: string
          nullable: true
          enum: [easy, medium, hard]
        notes:
          type: string
          nullable: true
          maxLength: 500

    CoachFeedback:
      type: object
      properties:
        id:
          type: string
          format: uuid
        coachRequestId:
          type: string
          format: uuid
        coachId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [note, habit_change]
          description: >-
            `note` is something the coach wrote. `habit_change` is written by
            the API itself when a coach edits one of the client's habits, so the
            client always sees what changed and when.
        body:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateFeedbackBody:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Invalid credentials

    MessageResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            message:
              type: string
              example: Success

    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Validation failed
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: email
              message:
                type: string
                example: Invalid email address

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: register
      description: Does not set auth cookies. Call POST /auth/login after registering.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive auth cookies
      operationId: login
      description: >
        On success, sets HttpOnly cookies: accessToken (15 min) and refreshToken (7 days).
        Include credentials on all requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh the access token
      operationId: refreshToken
      description: Reads the refreshToken cookie and issues new auth cookies.
      responses:
        "200":
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Missing or invalid refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Missing refresh token

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout and clear auth cookies
      operationId: logout
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
